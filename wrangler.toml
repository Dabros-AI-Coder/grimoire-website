# Cloudflare Pages Configuration
# ==============================

name = "grimoire-interactive"
compatibility_date = "2024-01-15"
pages_build_output_dir = "dist"

# Environment variables (set in Cloudflare Dashboard)
# [vars]
# NODE_VERSION = "20"

# Custom domains (configure in Cloudflare Dashboard after first deploy)
# routes = [
#   { pattern = "grimoire-interactive.de/*", zone_name = "grimoire-interactive.de" },
#   { pattern = "www.grimoire-interactive.de/*", zone_name = "grimoire-interactive.de" }
# ]

# Build configuration
[build]
  command = "npm run build"
  cwd = "."
  watch_dir = "src"

# Dev server
[dev]
  port = 4321
  host = "localhost"

# Limits
[limits]
  cpu_ms = 50